name: Test flashcards
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check grading.js
      - name: Run tests
        run: node --test tests/*.test.cjs
